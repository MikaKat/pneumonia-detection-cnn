# Bindet Backend (Python/Modell) und Web (UI + nginx) zusammen.
# Der Browser spricht NUR mit "web". "web" reicht /api intern an "backend" weiter.
# Keiner der beiden Dienste veroeffentlicht einen Host-Port: erreichbar ist die
# Anwendung ausschliesslich ueber den Reverse Proxy davor.

services:
  backend:
    build:
      context: .
      dockerfile: serving/Dockerfile
    restart: unless-stopped
    environment:
      # KEIN THRESHOLD. Bis zum 09.08.2026 stand hier "0.5". Am selben Tag wurde
      # die gleichlautende Zeile aus serving/Dockerfile entfernt, diese hier
      # aber uebersehen, und sie haette den Fehler unveraendert weitergefuehrt:
      # compose setzt die Variable im Container, egal was im Abbild steht. Die
      # Schwelle kommt aus serving/model/kalibrierung_p10.json und aus keiner
      # Umgebungsvariablen; main.py bricht ab, wenn diese Zeile wiederkommt.
      RATE_LIMIT: "10"        # max. Analysen pro Client
      RATE_WINDOW: "3600"     # pro Stunde
    # RAM-Deckel, damit das Modell den kleinen Server nicht sprengt.
    # (Braucht Compose v2 / "docker compose"; bei älterem Compose s. Guide.)
    #
    # ACHTUNG, seit dem Umbau auf das Ensemble: geladen werden FUENF ResNet18
    # statt einem. Die Gewichte belegen rund 224 MB auf der Platte und als
    # float32-Parameter noch einmal rund 224 MB im Arbeitsspeicher, dazu
    # kommen fuenf Grad-CAM-Objekte mit ihren Zwischenspeichern. 900 MB waren
    # fuer ein Modell reichlich und sind fuer fuenf knapp. Wenn der Container
    # ohne Meldung stirbt (OOM-Kill), ist es diese Zeile und nicht der Code.
    deploy:
      resources:
        limits:
          memory: 1600M

  web:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: "http://backend:8000"   # nginx leitet /api hierhin weiter
    # `expose` statt `ports`. Ein Host-Mapping "80:80" belegt Port 80 der
    # Maschine, und auf dem lauscht bei einem verwalteten Deployment bereits der
    # Reverse Proxy der Plattform -> "port is already allocated", der Container
    # startet gar nicht erst. `expose` macht den Port nur im Docker-Netz
    # bekannt; der Proxy findet den Dienst ueber die konfigurierte Domain.
    # Fuer den Betrieb ohne Plattform-Proxy (lokal, oder eigener Server ohne
    # Traefik davor) diese Zeilen gegen `ports: ["80:80"]` tauschen.
    expose:
      - "80"
    depends_on:
      - backend
