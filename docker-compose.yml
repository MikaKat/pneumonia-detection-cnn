# Bindet Backend (Python/Modell) und Web (UI + nginx) zusammen.
# Der Browser spricht NUR mit "web". "web" reicht /api intern an "backend" weiter.
# Keiner der beiden Dienste veroeffentlicht einen Host-Port: erreichbar ist die
# Anwendung ausschliesslich ueber den Reverse Proxy davor.

services:
  backend:
    build:
      context: .
      dockerfile: serving/Dockerfile
    restart: unless-stopped
    environment:
      THRESHOLD: "0.5"
      RATE_LIMIT: "10"        # max. Analysen pro Client
      RATE_WINDOW: "3600"     # pro Stunde
    # RAM-Deckel, damit das Modell den kleinen Server nicht sprengt.
    # (Braucht Compose v2 / "docker compose"; bei älterem Compose s. Guide.)
    deploy:
      resources:
        limits:
          memory: 900M

  web:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: "http://backend:8000"   # nginx leitet /api hierhin weiter
    # `expose` statt `ports`. Ein Host-Mapping "80:80" belegt Port 80 der
    # Maschine, und auf dem lauscht bei einem verwalteten Deployment bereits der
    # Reverse Proxy der Plattform -> "port is already allocated", der Container
    # startet gar nicht erst. `expose` macht den Port nur im Docker-Netz
    # bekannt; der Proxy findet den Dienst ueber die konfigurierte Domain.
    # Fuer den Betrieb ohne Plattform-Proxy (lokal, oder eigener Server ohne
    # Traefik davor) diese Zeilen gegen `ports: ["80:80"]` tauschen.
    expose:
      - "80"
    depends_on:
      - backend
