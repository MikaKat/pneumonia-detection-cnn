# nginx config for the SPA. Serves the built static files and reverse-proxies
# /api to your Python backend so the browser only ever talks to one origin
# (no CORS needed). ${API_UPSTREAM} is substituted from the env var at startup.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip keeps the payload tiny on a small server
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache fingerprinted build assets aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy -> Python backend
    location /api/ {
        proxy_pass         ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow reasonably large X-ray uploads
        client_max_body_size 12m;

        # Inference can take a while behind the single-worker queue
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # SPA fallback: unknown routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
